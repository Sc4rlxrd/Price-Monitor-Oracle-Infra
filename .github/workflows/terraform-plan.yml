name: Terraform Plan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
    paths:
      - "**/*.tf"
      - ".terraform.lock.hcl"
      - "cloud-init/**"
      - "config/**"
      - "docker/**"
      - "monitoring/**"
      - "scripts/**"
      - "systemd/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: OCI Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Repository secrets are not exposed to pull requests from forks.
    # Skip the OCI plan in that situation instead of failing the workflow.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Validate required secrets
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VARS: ${{ secrets.TF_VARS }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for variable_name in \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_PRIVATE_KEY \
            TF_VARS \
            SSH_PUBLIC_KEY
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required secret ${variable_name} is not configured."
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          echo "All required GitHub Actions secrets are configured."

      - name: Configure OCI credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.oci"

          printf '%s\n' "${OCI_PRIVATE_KEY}" \
            > "${HOME}/.oci/oci_api_key.pem"

          chmod 0600 "${HOME}/.oci/oci_api_key.pem"

          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=sa-saopaulo-1
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

          chmod 0600 "${HOME}/.oci/config"

      - name: Configure Terraform inputs
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.ssh"

          printf '%s\n' "${SSH_PUBLIC_KEY}" \
            > "${HOME}/.ssh/price-monitor.pub"

          chmod 0600 "${HOME}/.ssh/price-monitor.pub"

          printf '%s\n' "${TF_VARS}" \
            > terraform.tfvars

          chmod 0600 terraform.tfvars

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -detailed-exitcode \
            -out=tfplan \
            -var="ssh_public_key_path=${HOME}/.ssh/price-monitor.pub" \
            > terraform-plan.log 2>&1

          PLAN_EXIT_CODE=$?

          set -e

          case "${PLAN_EXIT_CODE}" in
            0)
              echo "Terraform plan completed: no infrastructure changes."
              echo "changes=false" >> "${GITHUB_OUTPUT}"
              ;;

            2)
              echo "Terraform plan completed: infrastructure changes detected."
              echo "changes=true" >> "${GITHUB_OUTPUT}"
              ;;

            *)
              echo "::error::Terraform plan failed."

              sed -E \
                -e 's/ocid1\.[A-Za-z0-9._-]+/[REDACTED_OCID]/g' \
                -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[REDACTED_IP]/g' \
                terraform-plan.log

              exit 1
              ;;
          esac

      - name: Terraform plan summary
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform show -json tfplan > terraform-plan.json

          jq -r '
            [
              .resource_changes[]?
              | select(.change.actions != ["no-op"])
              | .change.actions
            ] as $changes
            |
            {
              create: (
                [$changes[] | select(index("create"))]
                | length
              ),
              update: (
                [$changes[] | select(index("update"))]
                | length
              ),
              delete: (
                [$changes[] | select(index("delete"))]
                | length
              )
            }
            |
            "Plan summary: \(.create) create, \(.update) update, \(.delete) delete"
          ' terraform-plan.json

      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          rm -f \
            terraform.tfvars \
            terraform-plan.log \
            terraform-plan.json \
            tfplan \
            "${HOME}/.ssh/price-monitor.pub" \
            "${HOME}/.oci/oci_api_key.pem" \
            "${HOME}/.oci/config"



