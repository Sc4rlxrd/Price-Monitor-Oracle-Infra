name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm production deployment"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "APPLY"

permissions:
  contents: read

concurrency:
  group: terraform-production-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  validate-request:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate branch and confirmation
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::Terraform Apply can only run from the master branch."
            exit 1
          fi

          if [[ "${{ inputs.confirmation }}" != "APPLY" ]]; then
            echo "::error::Deployment confirmation must be APPLY."
            exit 1
          fi

          echo "Production deployment request validated."


  preview:
    name: Preview Production Plan
    needs:
      - validate-request

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Validate required secrets
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VARS: ${{ secrets.TF_VARS }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for variable_name in \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_PRIVATE_KEY \
            TF_VARS \
            SSH_PUBLIC_KEY
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required secret ${variable_name} is not configured."
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Configure OCI credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.oci"

          printf '%s\n' "${OCI_PRIVATE_KEY}" \
            | tr -d '\r' \
            > "${HOME}/.oci/oci_api_key.pem"

          chmod 0600 "${HOME}/.oci/oci_api_key.pem"

          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=sa-saopaulo-1
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

          chmod 0600 "${HOME}/.oci/config"

      - name: Configure Terraform inputs
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.ssh"

          printf '%s\n' "${SSH_PUBLIC_KEY}" \
            > "${HOME}/.ssh/price-monitor.pub"

          chmod 0600 "${HOME}/.ssh/price-monitor.pub"

          printf '%s\n' "${TF_VARS}" \
            > terraform.tfvars

          chmod 0600 terraform.tfvars

      - name: Terraform init
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="auth=APIKey" \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${HOME}/.oci/oci_api_key.pem"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Generate preview plan
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -out=tfplan \
            -var="ssh_public_key_path=${HOME}/.ssh/price-monitor.pub" \
            > terraform-plan.log 2>&1

      - name: Production plan summary
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform show -json tfplan > terraform-plan.json

          CREATE_COUNT="$(
            jq '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | select(.change.actions | index("create"))
              ]
              | length
            ' terraform-plan.json
          )"

          UPDATE_COUNT="$(
            jq '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | select(.change.actions | index("update"))
              ]
              | length
            ' terraform-plan.json
          )"

          DELETE_COUNT="$(
            jq '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | select(.change.actions | index("delete"))
              ]
              | length
            ' terraform-plan.json
          )"

          echo "Plan summary: ${CREATE_COUNT} create, ${UPDATE_COUNT} update, ${DELETE_COUNT} delete"

          {
            echo "## Terraform Production Plan"
            echo
            echo "| Action | Count |"
            echo "| --- | ---: |"
            echo "| 🟢 Create | ${CREATE_COUNT} |"
            echo "| 🟡 Update | ${UPDATE_COUNT} |"
            echo "| 🔴 Delete | ${DELETE_COUNT} |"
            echo
            echo "**Environment:** \`production\`"
            echo
            echo "**Remote state:** OCI Object Storage"
            echo
            echo "The apply job requires approval through the production environment."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup preview files
        if: always()
        shell: bash
        run: |
          rm -f \
            terraform.tfvars \
            terraform-plan.log \
            terraform-plan.json \
            tfplan \
            "${HOME}/.ssh/price-monitor.pub" \
            "${HOME}/.oci/oci_api_key.pem" \
            "${HOME}/.oci/config"

          rm -rf .terraform


  apply:
    name: Apply Production Infrastructure
    needs:
      - preview

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Configure OCI credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.oci"

          printf '%s\n' "${OCI_PRIVATE_KEY}" \
            | tr -d '\r' \
            > "${HOME}/.oci/oci_api_key.pem"

          chmod 0600 "${HOME}/.oci/oci_api_key.pem"

          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=sa-saopaulo-1
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

          chmod 0600 "${HOME}/.oci/config"

      - name: Configure Terraform inputs
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.ssh"

          printf '%s\n' "${SSH_PUBLIC_KEY}" \
            > "${HOME}/.ssh/price-monitor.pub"

          chmod 0600 "${HOME}/.ssh/price-monitor.pub"

          printf '%s\n' "${TF_VARS}" \
            > terraform.tfvars

          chmod 0600 terraform.tfvars

      - name: Terraform init
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="auth=APIKey" \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${HOME}/.oci/oci_api_key.pem"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Generate approved plan
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -out=tfplan \
            -var="ssh_public_key_path=${HOME}/.ssh/price-monitor.pub" \
            > terraform-plan.log 2>&1

          echo "Approved Terraform plan generated."

      - name: Terraform apply
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform apply \
            -input=false \
            -lock-timeout=60s \
            tfplan

      - name: Verify final state
        shell: bash
        run: |
          set -Eeuo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -detailed-exitcode \
            -var="ssh_public_key_path=${HOME}/.ssh/price-monitor.pub" \
            > terraform-verify.log 2>&1

          VERIFY_EXIT_CODE=$?

          if [[ "${VERIFY_EXIT_CODE}" -eq 0 ]]; then
            echo "Infrastructure matches the Terraform configuration."
            exit 0
          fi

          if [[ "${VERIFY_EXIT_CODE}" -eq 2 ]]; then
            echo "::warning::Infrastructure still has pending Terraform changes."
            exit 0
          fi

          echo "::error::Post-apply Terraform verification failed."

          sed -E \
            -e 's/ocid1\.[A-Za-z0-9._-]+/[REDACTED_OCID]/g' \
            -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[REDACTED_IP]/g' \
            terraform-verify.log

          exit 1

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Terraform Apply"
            echo
            echo "✅ Production infrastructure deployment completed."
            echo
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo
            echo "**Environment:** \`production\`"
            echo
            echo "**Remote state:** OCI Object Storage"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          rm -f \
            terraform.tfvars \
            terraform-plan.log \
            terraform-verify.log \
            tfplan \
            "${HOME}/.ssh/price-monitor.pub" \
            "${HOME}/.oci/oci_api_key.pem" \
            "${HOME}/.oci/config"

          rm -rf .terraform

